services:
  - type: web
    name: reroute-intelligence-demo
    runtime: python
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: pip install .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: REROUTE_DATABASE_URL
        value: sqlite:////tmp/reroute-judge.db
      - key: REROUTE_RAZORPAY_KEY_ID
        sync: false
      - key: REROUTE_RAZORPAY_KEY_SECRET
        sync: false
      - key: REROUTE_RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: REROUTE_OPENROUTER_API_KEY
        sync: false
