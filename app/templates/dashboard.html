<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ReRoute Sentinel merchant payment incident operations" />
    <title>ReRoute Sentinel | Payment incident operations</title>
    <link rel="stylesheet" href="/static/css/sentinel-console.css" />
  </head>
  <body>
    <div class="sentinel-shell" data-sentinel-shell data-state="loading">
      <aside class="side-rail" aria-label="ReRoute Sentinel navigation">
        <a class="brand" href="#home" aria-label="ReRoute Sentinel home">
          <span class="brand-mark" aria-hidden="true">R</span>
          <span class="brand-copy">
            <strong>ReRoute Sentinel</strong>
            <small>Payment incident autopilot</small>
          </span>
        </a>

        <nav class="rail-nav" aria-label="Operator console">
          <div class="nav-group">
            <p class="nav-label">Operate</p>
            <button class="nav-item active" type="button" data-view="home" aria-current="page">
              <span class="nav-icon" aria-hidden="true">⌂</span><span>Home</span>
            </button>
            <button class="nav-item" type="button" data-view="payments">
              <span class="nav-icon" aria-hidden="true">↔</span><span>Payments</span>
            </button>
            <button class="nav-item" type="button" data-view="incidents">
              <span class="nav-icon" aria-hidden="true">!</span><span>Incidents</span>
              <span class="nav-count" data-incident-count hidden>0</span>
            </button>
            <button class="nav-item" type="button" data-view="recoveries">
              <span class="nav-icon" aria-hidden="true">↗</span><span>Recoveries</span>
            </button>
          </div>

          <div class="nav-group">
            <p class="nav-label">Control</p>
            <button class="nav-item" type="button" data-view="exceptions">
              <span class="nav-icon" aria-hidden="true">△</span><span>Exceptions</span>
            </button>
            <button class="nav-item" type="button" data-view="policy">
              <span class="nav-icon" aria-hidden="true">◇</span><span>Policy &amp; Safety</span>
            </button>
          </div>

          <div class="nav-group">
            <p class="nav-label">Prove</p>
            <button class="nav-item" type="button" data-view="outcomes">
              <span class="nav-icon" aria-hidden="true">✓</span><span>Outcomes</span>
            </button>
            <button class="nav-item" type="button" data-view="evaluation">
              <span class="nav-icon" aria-hidden="true">⌁</span><span>Evaluation</span>
            </button>
          </div>
        </nav>

        <div class="rail-footer">
          <a href="/docs" target="_blank" rel="noreferrer">Documentation</a>
          <span class="mode-pill"><span class="status-dot"></span>Test Mode</span>
        </div>
      </aside>

      <div class="workspace">
        <header class="workspace-bar">
          <div class="workspace-title">
            <span class="live-status"><span class="status-dot"></span><span data-live-label>Watching payments</span></span>
            <span class="latest-event" data-latest-event>Waiting for payment activity</span>
          </div>
          <div class="workspace-actions">
            <span class="truth-chip simulated">SIMULATED DEMO DATA</span>
            <a class="button button-secondary" href="/storefront">Open storefront</a>
          </div>
        </header>

        <main class="console-main" id="consoleMain" tabindex="-1">
          <div id="screen" aria-live="polite"></div>
        </main>
      </div>
    </div>

    <div class="toast-stack" aria-live="assertive" aria-atomic="true" data-toast-stack></div>
    <div class="sr-only" aria-live="polite" data-announcer></div>
    <script type="module" src="/static/js/sentinel-console.js"></script>
  </body>
</html>
