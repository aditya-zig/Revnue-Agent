name: Browser Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke
  cancel-in-progress: true

jobs:
  verify-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install browser driver
        shell: bash
        run: npm install --no-save playwright-core@1.55.0

      - name: Exercise production dashboard and storefront
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright-core');

          const candidates = [
            '/usr/bin/google-chrome',
            '/usr/bin/google-chrome-stable',
            '/usr/bin/chromium',
            '/usr/bin/chromium-browser',
          ];
          const executablePath = candidates.find((path) => fs.existsSync(path));
          if (!executablePath) throw new Error('No Chromium-compatible browser found on runner');

          const base = 'https://revnue-agent.vercel.app';
          const browser = await chromium.launch({ headless: true, executablePath });

          async function verifyDashboard(viewport) {
            const page = await browser.newPage({ viewport });
            await page.goto(`${base}/`, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForSelector('.dashboard-sidebar', { state: 'visible', timeout: 30000 });
            await page.waitForFunction(() => window.ReRouteDashboard?.getData?.(), null, { timeout: 30000 });

            const views = ['overview', 'queue', 'investigation', 'exceptions', 'evaluation', 'governance', 'inbox'];
            for (const view of views) {
              const button = page.locator(`[data-dashboard-navigation] [data-view="${view}"]`).first();
              await button.scrollIntoViewIfNeeded();
              await button.click();
              await page.waitForFunction((id) => {
                const panel = document.getElementById(id);
                return panel && !panel.hidden && panel.getAttribute('aria-hidden') === 'false';
              }, view, { timeout: 10000 });
              const hash = await page.evaluate(() => window.location.hash);
              if (hash !== `#${view}`) throw new Error(`Navigation hash mismatch for ${view}: ${hash}`);
            }

            const population = await page.evaluate(() => window.ReRouteDashboard.getData().population);
            if (population.total < 999 || population.captured < 749 || population.failed < 250) {
              throw new Error(`Unexpected production population: ${JSON.stringify(population)}`);
            }
            await page.close();
          }

          await verifyDashboard({ width: 1440, height: 1000 });
          await verifyDashboard({ width: 390, height: 844 });

          const storefront = await browser.newPage({ viewport: { width: 1280, height: 900 } });
          await storefront.goto(`${base}/storefront`, { waitUntil: 'domcontentloaded', timeout: 60000 });
          await storefront.waitForSelector('#buy-now', { state: 'visible', timeout: 30000 });
          const text = await storefront.locator('h1').textContent();
          if (!text?.includes('5 kg Dumbbell')) throw new Error(`Unexpected product title: ${text}`);

          await storefront.click('#buy-now');
          await storefront.waitForFunction(() => {
            const text = document.getElementById('checkout-status')?.textContent || '';
            return text.includes('Checkout opened') || text.includes('Choose the Test Mode failure path');
          }, null, { timeout: 30000 });
          const status = await storefront.locator('#checkout-status').textContent();
          console.log(`STOREFRONT_CHECKOUT_UI=PASS status=${status}`);

          await storefront.close();
          await browser.close();
          console.log('BROWSER_NAVIGATION=PASS desktop+mobile');
          NODE
