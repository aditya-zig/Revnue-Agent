name: CI

on:
  push:
    branches:
      - main
      - "chatgpt/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync
        run: uv sync --dev

      - name: JavaScript syntax
        run: |
          node --check app/static/js/api.js
          node --check app/static/js/app.js
          node --check app/static/js/dashboard-view.js
          node --check app/static/js/dashboard-format.js
          node --check app/static/js/recovery-workflow.js
          node --check app/static/js/sentinel-api.js
          node --check app/static/js/sentinel.js
          node --check app/static/js/guided-sandbox.js
          node --check tests/browser/sentinel-browser-test.mjs

      - name: Sentinel frontend contract
        run: |
          uv run pytest -q \
            tests/static/test_sentinel_frontend_contract.py \
            tests/integration/test_dashboard.py \
            tests/integration/test_dashboard_provenance_contract.py \
            tests/integration/test_storefront_checkout.py

      - name: Rendered Sentinel browser journey
        env:
          SENTINEL_SCREENSHOT_DIR: ${{ runner.temp }}/sentinel-screenshots
        run: bash tests/browser/sentinel-visual.test.sh

      - name: Upload Sentinel screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-browser-screenshots
          path: ${{ runner.temp }}/sentinel-screenshots
          if-no-files-found: warn
          retention-days: 7

      - name: Ruff
        if: always()
        run: uv run ruff check .

      - name: mypy
        if: always()
        run: uv run mypy

      - name: Tests
        if: always()
        run: uv run pytest -q
