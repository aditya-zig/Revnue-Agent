name: Database Diagnostic

on:
  push:
    paths:
      - .github/workflows/database-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Capture production health
        shell: bash
        run: |
          set -euo pipefail
          sleep 10
          curl --silent --show-error --location \
            --connect-timeout 5 --max-time 20 \
            https://revnue-agent.vercel.app/health \
            -o /tmp/health.json
          python -m json.tool /tmp/health.json
