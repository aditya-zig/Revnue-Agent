name: Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for the matching Vercel deployment
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://revnue-agent.vercel.app"
          rm -f /tmp/reroute-health.json

          for attempt in $(seq 1 36); do
            code="$(curl --silent --show-error --location \
              --connect-timeout 5 --max-time 12 \
              --output /tmp/reroute-health.json \
              --write-out '%{http_code}' \
              "$base_url/health" || true)"
            body="$(cat /tmp/reroute-health.json 2>/dev/null || true)"
            if [[ "$code" == "200" && "$body" == *'"components"'* ]]; then
              echo "Production health endpoint reached on attempt $attempt."
              break
            fi
            if [[ "$attempt" == "36" ]]; then
              echo "Production health endpoint never became reachable. HTTP=$code"
              printf '%s\n' "$body"
              exit 1
            fi
            sleep 10
          done

          echo "HEALTH_HTTP=$code"
          cat /tmp/reroute-health.json
          echo

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/reroute-health.json").read_text())
          assert payload.get("status") == "ok", payload
          assert payload.get("ready") is True, payload
          PY

      - name: Verify public production routes
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://revnue-agent.vercel.app"

          check_route() {
            path="$1"
            expected_type="$2"
            output="/tmp/reroute-route-${RANDOM}"
            code="$(curl --silent --show-error --location \
              --connect-timeout 5 --max-time 20 \
              --output "$output" \
              --write-out '%{http_code}' \
              "$base_url$path" || true)"
            echo "$path HTTP=$code"
            if [[ "$code" != "200" ]]; then
              head -c 600 "$output" || true
              echo
              exit 1
            fi
            if [[ "$expected_type" == "html" ]]; then
              grep -Eiq '<!doctype html|<html' "$output"
            elif [[ "$expected_type" == "json" ]]; then
              python -m json.tool "$output" >/dev/null
            elif [[ "$expected_type" == "css" ]]; then
              test -s "$output"
            fi
          }

          check_route "/" html
          check_route "/judge" html
          check_route "/storefront" html
          check_route "/static/css/dashboard.css" css
          check_route "/api/v1/dashboard" json
