name: Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for persistent production readiness
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://revnue-agent.vercel.app"
          rm -f /tmp/reroute-health.json

          for attempt in $(seq 1 48); do
            code="$(curl --silent --show-error --location \
              --connect-timeout 5 --max-time 12 \
              --output /tmp/reroute-health.json \
              --write-out '%{http_code}' \
              "$base_url/health" || true)"
            body="$(cat /tmp/reroute-health.json 2>/dev/null || true)"
            if [[ "$code" == "200" && "$body" == *'"ready":true'* && "$body" == *'"database_source":"reroute_database_url"'* ]]; then
              echo "Persistent production became ready on attempt $attempt."
              break
            fi
            if [[ "$attempt" == "48" ]]; then
              echo "Persistent production never became ready. HTTP=$code"
              printf '%s\n' "$body"
              exit 1
            fi
            sleep 10
          done

          echo "HEALTH_HTTP=$code"
          cat /tmp/reroute-health.json
          echo

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/reroute-health.json").read_text())
          assert payload.get("status") == "ok", payload
          assert payload.get("ready") is True, payload
          components = payload.get("components", {})
          assert components.get("database") == "ready", payload
          assert components.get("database_source") == "reroute_database_url", payload
          assert components.get("database_configuration_reason") == "ok", payload
          PY

      - name: Verify public production routes
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://revnue-agent.vercel.app"

          check_route() {
            path="$1"
            expected_type="$2"
            output="/tmp/reroute-route-${RANDOM}"
            code="$(curl --silent --show-error --location \
              --connect-timeout 5 --max-time 20 \
              --output "$output" \
              --write-out '%{http_code}' \
              "$base_url$path" || true)"
            echo "$path HTTP=$code"
            if [[ "$code" != "200" ]]; then
              head -c 600 "$output" || true
              echo
              exit 1
            fi
            if [[ "$expected_type" == "html" ]]; then
              grep -Eiq '<!doctype html|<html' "$output"
            elif [[ "$expected_type" == "json" ]]; then
              python -m json.tool "$output" >/dev/null
            elif [[ "$expected_type" == "css" ]]; then
              test -s "$output"
            fi
          }

          check_route "/" html
          check_route "/judge" html
          check_route "/storefront" html
          check_route "/static/css/sentinel.css" css
          check_route "/api/v1/dashboard" json
          check_route "/api/v1/policy-settings" json

          curl --silent --show-error --location "$base_url/" -o /tmp/dashboard.html
          grep -q '/static/css/sentinel.css' /tmp/dashboard.html
          grep -q 'ReRoute Sentinel' /tmp/dashboard.html
          grep -q 'Policy &amp; Safety' /tmp/dashboard.html
          grep -q 'Judge mode' /tmp/dashboard.html

      - name: Verify hosted 999-payment simulation
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://revnue-agent.vercel.app"

          code="$(curl --silent --show-error --location \
            --connect-timeout 5 --max-time 45 \
            --request POST \
            --output /tmp/simulate.json \
            --write-out '%{http_code}' \
            "$base_url/api/v1/data/simulate-999")"
          echo "SIMULATE_HTTP=$code"
          cat /tmp/simulate.json
          echo
          test "$code" = "201"

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/simulate.json").read_text())
          assert payload["payments_total"] == 999, payload
          assert payload["successes"] == 749, payload
          assert payload["failures"] == 250, payload
          assert payload["findings"] == 37, payload
          assert payload["top_finding_id"], payload
          print(
              "SIMULATE_999=PASS",
              f"created={payload['payments_created']}",
              f"already_present={payload['already_present']}",
          )
          PY

          curl --silent --show-error --location \
            --connect-timeout 5 --max-time 30 \
            "$base_url/api/v1/dashboard" \
            -o /tmp/dashboard-after-sim.json

          python - <<'PY'
          import json
          from pathlib import Path

          dashboard = json.loads(Path("/tmp/dashboard-after-sim.json").read_text())
          population = dashboard["population"]
          assert population["total"] >= 999, population
          assert population["captured"] >= 749, population
          assert population["failed"] >= 250, population
          assert dashboard["executive"]["open_cases"] >= 250, dashboard["executive"]
          print(
              "DASHBOARD_AFTER_SIM=PASS",
              f"total={population['total']}",
              f"open_cases={dashboard['executive']['open_cases']}",
          )
          PY

          code="$(curl --silent --show-error --location \
            --connect-timeout 5 --max-time 20 \
            --request POST \
            --output /tmp/simulate-repeat.json \
            --write-out '%{http_code}' \
            "$base_url/api/v1/data/simulate-999")"
          echo "SIMULATE_REPEAT_HTTP=$code"
          test "$code" = "201"
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/simulate-repeat.json").read_text())
          assert payload["payments_total"] == 999, payload
          assert payload["already_present"] is True, payload
          assert payload["duplicates"] == 999, payload
          print("SIMULATE_REPEAT=PASS")
          PY

      - name: Verify Supabase write and read-back
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://revnue-agent.vercel.app"

          curl --silent --show-error --location \
            --connect-timeout 5 --max-time 20 \
            "$base_url/api/v1/policy-settings" \
            -o /tmp/policy-before.json

          python - <<'PY'
          import json
          from pathlib import Path

          before = json.loads(Path("/tmp/policy-before.json").read_text())
          payload = {
              "quiet_hours_start": before["quiet_hours_start"],
              "quiet_hours_end": before["quiet_hours_end"],
              "contact_limit": before["contact_limit"],
              "kill_switch": before["kill_switch"],
              "mock_identity": before["mock_identity"],
          }
          Path("/tmp/policy-write.json").write_text(json.dumps(payload))
          Path("/tmp/policy-version-before").write_text(str(before["version"]))
          PY

          code="$(curl --silent --show-error --location \
            --connect-timeout 5 --max-time 20 \
            --request PUT \
            --header 'Content-Type: application/json' \
            --header 'X-Reroute-Role: business_owner' \
            --data-binary @/tmp/policy-write.json \
            --output /tmp/policy-write-response.json \
            --write-out '%{http_code}' \
            "$base_url/api/v1/policy-settings")"
          echo "POLICY_WRITE_HTTP=$code"
          test "$code" = "200"

          curl --silent --show-error --location \
            --connect-timeout 5 --max-time 20 \
            "$base_url/api/v1/policy-settings" \
            -o /tmp/policy-after.json

          python - <<'PY'
          import json
          from pathlib import Path

          before_version = int(Path("/tmp/policy-version-before").read_text())
          written = json.loads(Path("/tmp/policy-write-response.json").read_text())
          after = json.loads(Path("/tmp/policy-after.json").read_text())
          expected = json.loads(Path("/tmp/policy-write.json").read_text())
          assert written["version"] > before_version, (before_version, written)
          assert after["version"] == written["version"], (written, after)
          for key, value in expected.items():
              assert after[key] == value, (key, value, after[key])
          print(f"SUPABASE_WRITE_READBACK=PASS version={after['version']}")
          PY
