[project]
name = "reroute-intelligence"
version = "0.1.0"
description = "Payment failure recovery foundation"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "psycopg2-binary>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.9,<1",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
build = "python scripts/vercel_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
files = ["app", "tests"]
check_untyped_defs = true
warn_unused_ignores = true
